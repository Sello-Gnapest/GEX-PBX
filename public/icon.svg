<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Glowing Accent Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="10 14" opacity="0.4"/>

  <!-- Center Circular Plate -->
  <circle cx="256" cy="256" r="130" fill="#090d16" stroke="url(#accentGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Phone Handset Icon -->
  <g transform="translate(160, 160) scale(8)" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="#06b6d4" fill-opacity="0.15"/>
  </g>

  <!-- Live Status LED -->
  <circle cx="340" cy="172" r="16" fill="url(#emeraldGrad)"/>
  <circle cx="340" cy="172" r="24" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6"/>

  <!-- Bottom Badge: 031 PBX -->
  <rect x="156" y="380" width="200" height="48" rx="14" fill="#020617" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="256" y="412" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="3">031 PBX PWA</text>
</svg>
